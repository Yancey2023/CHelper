name: Set up CHelper build tools
description: Install and cache the tools needed by this job

inputs:
  tools:
    description: Space-separated names of the locked mise tools to install
    required: true
  task-tools:
    description: Space-separated backend names to install when the job runs their tasks
    default: ""
  native-cache:
    description: Compiler cache group
    default: ""
  pnpm-cache:
    description: Cache the pnpm store
    default: "false"
  resources-cache:
    description: Cache generated client resources by their exact inputs
    default: "false"
  resources-artifact:
    description: Download the named client resources artifact from this workflow run
    default: ""
  wasm-cache:
    description: Cache the generated Web runtime and declarations by their exact inputs
    default: "false"
  compiler-packages:
    description: Install and cache the compiler selected by CXX on Linux
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.resources-artifact != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.resources-artifact }}
        path: build/artifacts/resources

    - if: inputs.resources-cache == 'true' && inputs.resources-artifact == ''
      id: resources
      uses: actions/cache@v6
      with:
        path: build/artifacts/resources
        key: >-
          client-resources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
          'mise.toml', 'mise.lock', 'CHelper-Core/CMakeLists.txt', 'CHelper-Core/CMakePresets.json',
          'CHelper-Core/cmake/Sources.cmake', 'CHelper-Core/cmake/StageClientResources.cmake',
          'CHelper-Core/src/chelper/**', 'CHelper-Core/src/apps/CHelperResourceGenerator.*',
          'CHelper-Resource/resources/**', 'CHelper-Compose/resources/about/**',
          'CHelper-Compose/resources/rawtext/**', 'CHANGELOG.md') }}

    - if: inputs.wasm-cache == 'true'
      id: wasm
      uses: actions/cache@v6
      with:
        path: |
          build/web_core/libCHelperWeb.js
          build/web_core/libCHelperWeb.wasm
          build/web_core/libCHelperWeb.d.ts
        key: >-
          web-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(
          'mise.toml', 'mise.lock', 'CHelper-Core/CMakeLists.txt', 'CHelper-Core/CMakePresets.json',
          'CHelper-Core/cmake/Sources.cmake', 'CHelper-Core/cmake/ConfigureWeb.cmake',
          'CHelper-Core/src/chelper/**', 'CHelper-Core/src/apps/CHelperWeb.cpp',
          'CHelper-Web/package.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    - if: inputs.resources-artifact != '' || steps.resources.outputs.cache-hit == 'true' || steps.wasm.outputs.cache-hit == 'true'
      id: prepared
      shell: bash
      env:
        RESOURCES_READY: ${{ inputs.resources-artifact != '' || steps.resources.outputs.cache-hit == 'true' }}
        WASM_HIT: ${{ steps.wasm.outputs.cache-hit }}
      run: |
        skip=()
        if [[ $RESOURCES_READY == true ]]; then
          skip+=(resources:pack)
          echo 'resources=true' >> "$GITHUB_OUTPUT"
        fi
        if [[ $WASM_HIT == true ]]; then skip+=(core:wasm); fi
        (IFS=,; printf 'MISE_TASK_SKIP=%s\n' "${skip[*]}") >> "$GITHUB_ENV"

    - uses: jdx/mise-action@v5
      env:
        MISE_AUTO_INSTALL: "false"
      with:
        version: "2026.11.7"
        install_args: --locked ${{ steps.wasm.outputs.cache-hit == 'true' && steps.prepared.outputs.resources == 'true' && 'node pnpm' || inputs.tools }}
        # A cache saved without emsdk must not shadow the build-tool cache.
        cache_key_prefix: ${{ steps.wasm.outputs.cache-hit == 'true' && 'mise-v1-no-wasm-sdk' || 'mise-v1' }}
        cache_save_post: ${{ inputs.task-tools != '' && steps.wasm.outputs.cache-hit != 'true' }}

    - if: inputs.task-tools != '' && steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      env:
        CHELPER_MISE_SELECTED_TOOLS: ${{ inputs.tools }} ${{ inputs.task-tools }}
      run: |
        read -r -a selected_tools <<< "$CHELPER_MISE_SELECTED_TOOLS"
        (
          IFS=,
          printf 'MISE_ENABLE_TOOLS=%s\n' "${selected_tools[*]}"
          printf 'MISE_AUTO_INSTALL=true\n'
        ) >> "$GITHUB_ENV"

    - if: inputs.native-cache != '' && (steps.wasm.outputs.cache-hit != 'true' || steps.prepared.outputs.resources != 'true')
      shell: bash
      run: |
        {
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CCACHE_DIR=${{ runner.temp }}/chelper-ccache"
          echo "CCACHE_BASEDIR=${{ github.workspace }}"
          echo "CCACHE_MAXSIZE=350M"
          echo "CCACHE_COMPILERCHECK=content"
        } >> "$GITHUB_ENV"

    - if: inputs.native-cache != '' && (steps.wasm.outputs.cache-hit != 'true' || steps.prepared.outputs.resources != 'true')
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/chelper-ccache
        key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ inputs.native-cache }}-${{ github.sha }}
        restore-keys: |
          ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-${{ inputs.native-cache }}-
          ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock') }}-

    - if: inputs.native-cache != '' && (steps.wasm.outputs.cache-hit != 'true' || steps.prepared.outputs.resources != 'true')
      uses: actions/cache@v6
      with:
        path: CHelper-Core/3rdparty_downloads
        key: cxx-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CHelper-Core/CMakeLists.txt') }}
        restore-keys: cxx-deps-v2-${{ runner.os }}-${{ runner.arch }}-

    - if: inputs.pnpm-cache == 'true'
      id: pnpm
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - if: inputs.pnpm-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm.outputs.path }}
        key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'pnpm-lock.yaml') }}
        restore-keys: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-

    - if: inputs.compiler-packages == 'true' && runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/chelper-apt/*.deb
        key: core-apt-v2-ubuntu24-${{ runner.arch }}-${{ env.CXX }}-${{ hashFiles('mise.toml') }}
        restore-keys: core-apt-v2-ubuntu24-${{ runner.arch }}-${{ env.CXX }}-

    - if: inputs.compiler-packages == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/chelper-apt/partial"
        mise run core:linux-compilers
