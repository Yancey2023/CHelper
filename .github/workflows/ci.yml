name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_AUTO_INSTALL: "false"
  MISE_LOCKED: "1"
  CLIENT_RESOURCES_ARTIFACT: client-resources

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.paths.outputs.core }}
      resources: ${{ steps.paths.outputs.resources }}
      resource-rust: ${{ steps.paths.outputs.resource_rust }}
      android: ${{ steps.paths.outputs.android }}
      windows: ${{ steps.paths.outputs.windows }}
      web: ${{ steps.paths.outputs.web }}
      docs: ${{ steps.paths.outputs.docs }}
      clients: ${{ steps.paths.outputs.android == 'true' || steps.paths.outputs.windows == 'true' || steps.paths.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          declare -A jobs=([core]=false [resources]=false [resource_rust]=false [android]=false [windows]=false [web]=false [docs]=false)
          all_jobs() {
            for job in "${!jobs[@]}"; do jobs[$job]=true; done
          }

          base=$BEFORE
          if [[ $EVENT == pull_request ]]; then
            base='HEAD^1'
          elif [[ $base =~ ^[0-9a-f]{40}$ && $base =~ [1-9a-f] ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi

          paths=$(mktemp)
          trap 'rm -f -- "$paths"' EXIT
          if [[ -z $base ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null ||
              ! git diff --no-renames --name-only -z "$base" HEAD -- > "$paths"; then
            all_jobs
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                CHelper-Core/docs/*|CHelper-Core/README.md|CHelper-Compose/docs/*|CHelper-Compose/performance/*|CHelper-Compose/README.md|CHelper-Resource/doc/*) ;;
                CHelper-Resource/crates/*|CHelper-Resource/Cargo.*)
                  jobs[resources]=true jobs[resource_rust]=true ;;
                CHelper-Resource/*) jobs[resources]=true ;;
                mise.toml|mise.lock|.github/workflows/ci.yml|.github/actions/*)
                  all_jobs; break ;;
                CHelper-Core/tests/*|CHelper-Core/src/apps/qt/*) jobs[core]=true ;;
                CHelper-Core/src/apps/CHelperWeb.cpp) jobs[core]=true jobs[web]=true ;;
                CHelper-Core/cmake/ConfigureWeb.cmake) jobs[web]=true ;;
                CHelper-Core/src/apps/CHelperJvm.cpp) jobs[android]=true jobs[windows]=true ;;
                CHelper-Core/src/apps/CHelperResourceGenerator.*|CHelper-Core/cmake/StageClientResources.cmake)
                  jobs[resources]=true jobs[android]=true jobs[windows]=true jobs[web]=true ;;
                CHelper-Core/*) jobs[core]=true jobs[android]=true jobs[windows]=true jobs[web]=true ;;
                CHelper-Compose/apps/android/src/*|CHelper-Compose/apps/benchmark/src/*) jobs[android]=true ;;
                CHelper-Compose/apps/desktop/src/*) jobs[windows]=true ;;
                CHelper-Compose/*|CHANGELOG.md) jobs[android]=true jobs[windows]=true ;;
                CHelper-Web/*|.github/workflows/deploy-web.yml) jobs[web]=true ;;
                CHelper-Doc/*|.github/workflows/deploy-doc.yml) jobs[docs]=true ;;
                package.json|pnpm-workspace.yaml|pnpm-lock.yaml) jobs[web]=true jobs[docs]=true ;;
              esac
            done < "$paths"
          fi
          for job in "${!jobs[@]}"; do
            printf '%s=%s\n' "$job" "${jobs[$job]}" >> "$GITHUB_OUTPUT"
          done

  resources:
    needs: changes
    if: needs.changes.outputs.resources == 'true' || needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja ccache
          native-cache: resource-generator
          resources-cache: "true"
      - run: mise run resources:pack
      - if: needs.changes.outputs.clients == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CLIENT_RESOURCES_ARTIFACT }}
          path: build/artifacts/resources/
          if-no-files-found: error
          overwrite: true

  resources-rust:
    needs: changes
    if: needs.changes.outputs.resource-rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CHelper-Resource
      - run: mise run resources:test

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        type: [release, debug]
        compiler: [gcc, clang, msvc]
        include:
          - {
              compiler: gcc,
              os: ubuntu-24.04,
              cc: gcc-13,
              cxx: g++-13,
              qt: "6.12.0",
            }
          - {
              compiler: clang,
              os: ubuntu-24.04,
              cc: clang-19,
              cxx: clang++-19,
              qt: "6.12.0",
            }
          - {
              compiler: msvc,
              os: windows-2025,
              cc: cl,
              cxx: cl,
              qt: "6.10.3",
            }
          - {
              compiler: appleclang,
              type: release,
              os: macos-15,
              cc: clang,
              cxx: clang++,
              qt: "",
            }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja ccache ${{ matrix.qt != '' && 'python' || '' }}
          native-cache: core-${{ matrix.compiler }}-${{ matrix.type }}
          compiler-packages: "true"
      - if: matrix.qt != ''
        uses: jurplel/install-qt-action@v4.5.0
        with:
          version: ${{ matrix.qt }}
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.4"
          setup-python: false
          cache: true
      - run: mise run ${{ matrix.type == 'debug' && 'core:test:debug' || 'core:test' }}
      - if: matrix.qt != ''
        run: mise run ${{ matrix.type == 'debug' && 'core:qt:debug' || 'core:qt' }}

  sanitizers:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task: [tests, fuzz]
    env:
      CXX: clang++-19
      CC: clang-19
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja ccache
          native-cache: core-sanitizers-${{ matrix.task }}
          compiler-packages: "true"
      - run: mise run core:sanitize:${{ matrix.task }}

  android:
    needs: [changes, resources]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja java ccache
          task-tools: http:android-ndk
          native-cache: android
          resources-artifact: ${{ env.CLIENT_RESOURCES_ARTIFACT }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Build and test Android
        run: mise run android:ci
      - uses: actions/upload-artifact@v7
        with:
          name: chelper-android
          path: CHelper-Compose/apps/android/build/outputs/apk/release/*.apk

  windows:
    needs: [changes, resources]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja java ccache
          native-cache: windows
          resources-artifact: ${{ env.CLIENT_RESOURCES_ARTIFACT }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Build and test Windows
        run: mise run windows:ci
      - uses: actions/upload-artifact@v7
        with:
          name: chelper-windows-x64
          path: |
            CHelper-Compose/apps/desktop/build/compose/binaries/main/app/
            CHelper-Compose/apps/desktop/build/compose/binaries/main/msi/*.msi
            CHelper-Compose/apps/desktop/build/compose/binaries/main/exe/*.exe

  web:
    needs: [changes, resources]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja node pnpm python ccache
          task-tools: http:emsdk
          native-cache: wasm
          pnpm-cache: "true"
          resources-artifact: ${{ env.CLIENT_RESOURCES_ARTIFACT }}
          wasm-cache: "true"
      - run: |
          mise run web:build --base=/${{ github.event.repository.name }}/ --mode production ::: web:test

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
        with:
          tools: node pnpm
          pnpm-cache: "true"
      - run: mise run docs:build --base=/chelper_doc/
