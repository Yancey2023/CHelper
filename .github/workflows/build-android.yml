name: Compose Android and Windows CI

on:
  push:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-android.yml"
      - "CHelper-Compose/**"
      - "scripts/check_android_headers.py"
      - "scripts/check_android_resources.py"
      - "scripts/test_android_resources.py"
      - "scripts/check_compose_architecture.py"
      - "scripts/test_compose_architecture.py"
      - "scripts/test_check_compose_architecture.py"
      - "scripts/format_android.py"
      - "scripts/format_compose.py"
      - "scripts/build_desktop_core.py"
      - "scripts/native_build_tools.py"
      - "scripts/prepare_windows_installer.py"
      - "scripts/check_windows_installer.py"
      - "scripts/build.py"
      - "CHelper-Core/**"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-android.yml"
      - "CHelper-Compose/**"
      - "scripts/check_android_headers.py"
      - "scripts/check_android_resources.py"
      - "scripts/test_android_resources.py"
      - "scripts/check_compose_architecture.py"
      - "scripts/test_compose_architecture.py"
      - "scripts/test_check_compose_architecture.py"
      - "scripts/format_android.py"
      - "scripts/format_compose.py"
      - "scripts/build_desktop_core.py"
      - "scripts/native_build_tools.py"
      - "scripts/prepare_windows_installer.py"
      - "scripts/check_windows_installer.py"
      - "scripts/build.py"
      - "CHelper-Core/**"

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Kotlin license headers
        run: python3 scripts/check_android_headers.py

      - name: Check Compose architecture boundaries
        run: |
          python3 -m unittest discover -s scripts -p "test*compose_architecture.py"
          python3 scripts/check_compose_architecture.py
          python3 -m unittest discover -s scripts -p "test_android_resources.py"

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: "27"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        working-directory: ${{ github.workspace }}/CHelper-Compose
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ${{ github.workspace }}/CHelper-Compose
        run: ./gradlew :apps:android:testDebugUnitTest :apps:android:assembleRelease :apps:android:lintDebug :shared:domain:jvmTest :shared:domain:testAndroidHostTest :shared:data:jvmTest :shared:data:testAndroidHostTest :shared:ui:jvmTest :shared:ui:testAndroidHostTest :platform:jvm:test --warning-mode all

      - name: Check packaged Compose resources
        working-directory: ${{ github.workspace }}/CHelper-Compose
        run: python3 ../scripts/check_android_resources.py apps/android/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: chelper-android
          path: CHelper-Compose/apps/android/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "27"
          distribution: "temurin"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install native build tools
        run: python -m pip install -r scripts/requirements-build.txt
      - name: Test shared code and package Windows application
        working-directory: CHelper-Compose
        run: .\gradlew.bat :platform:jvm:test :shared:domain:jvmTest :shared:data:jvmTest :shared:ui:jvmTest :apps:desktop:test :apps:desktop:createDistributable :apps:desktop:packageMsi :apps:desktop:packageExe --warning-mode all
      - name: Verify Windows share-link protocol registration
        run: python scripts/check_windows_installer.py CHelper-Compose/apps/desktop/build/compose/binaries/main/msi/CHelper-26.2.0.msi
      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: chelper-windows-x64
          path: |
            CHelper-Compose/apps/desktop/build/compose/binaries/main/app/
            CHelper-Compose/apps/desktop/build/compose/binaries/main/msi/*.msi
            CHelper-Compose/apps/desktop/build/compose/binaries/main/exe/*.exe
