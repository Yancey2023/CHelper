name: Deploy CHelper-Doc

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/deploy-doc.yml"
      - "CHelper-Doc/**"
      - ".github/actions/setup-mise/**"
      - "mise.toml"
      - "mise.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-doc-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false"
  MISE_LOCKED: "1"

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise
        with:
          tools: node pnpm
          pnpm-cache: "true"

      - name: Build
        run: mise run docs:build --base=/chelper_doc/

      - name: Deploy
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ACCESS_TOKEN }}
          ARGS: "-avz --delete"
          SOURCE: "CHelper-Doc/.vitepress/dist/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.CHELPER_DOC_TARGET }}
