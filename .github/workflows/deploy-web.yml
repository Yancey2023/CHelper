name: Deploy CHelper-Web

on:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/deploy-web.yml"
      - "CHelper-Web/**"
      - ".github/actions/setup-mise/**"
      - "mise.toml"
      - "mise.lock"
      - "CHelper-Core/**"
      - "CHelper-Resource/resources/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false"
  MISE_LOCKED: "1"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise
        with:
          tools: cmake ninja node pnpm python ccache
          task-tools: http:emsdk
          native-cache: wasm
          pnpm-cache: "true"
          resources-cache: "true"
          wasm-cache: "true"

      - name: Build For GitHub Page
        run: mise run web:build --base=/${{ github.event.repository.name }}/ --mode production

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./CHelper-Web/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Build For My Server
        run: mise run web:bundle --base=/chelper/ --mode my_server

      - name: Deploy
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ACCESS_TOKEN }}
          ARGS: "-avz --delete"
          SOURCE: "CHelper-Web/dist/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.CHELPER_WEB_TARGET }}
