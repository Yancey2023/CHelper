name: build-wasm

on:
  push:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-wasm.yml"
      - "CHelper-Core/**"
      - "scripts/requirements-build.txt"
      - "scripts/**"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-wasm.yml"
      - "CHelper-Core/**"
      - "scripts/requirements-build.txt"
      - "scripts/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install native build tools
        run: python -m pip install -r scripts/requirements-build.txt

      - name: Build Web Core
        run: python ./scripts/build_web_core.py
