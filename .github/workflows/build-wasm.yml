name: build-wasm

on:
  push:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-wasm.yml"
      - "CHelper-Core/**"
      - "scripts/requirements-build.txt"
      - "scripts/**"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-wasm.yml"
      - "CHelper-Core/**"
      - "scripts/requirements-build.txt"
      - "scripts/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt

      - name: Install native build tools
        run: python -m pip install -r scripts/requirements-build.txt

      - name: Cache third-party sources
        uses: actions/cache@v5
        with:
          path: CHelper-Core/3rdparty_downloads
          key: thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CHelper-Core/CMakeLists.txt') }}
          restore-keys: |
            thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Emscripten SDK
        uses: actions/cache@v5
        with:
          path: toolchain/emsdk
          key: emsdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_web_core.py') }}
          restore-keys: |
            emsdk-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Web Core
        run: python ./scripts/build_web_core.py
