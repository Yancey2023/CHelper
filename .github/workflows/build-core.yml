name: build-core

on:
  push:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-core.yml"
      - "CHelper-Core/**"
      - "scripts/requirements-build.txt"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/build-core.yml"
      - "CHelper-Core/**"
      - "scripts/requirements-build.txt"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        build_type: [Release, Debug]
        c_compiler: [gcc-13, clang-19, cl]
        include:
          - os: ubuntu-24.04
            c_compiler: gcc-13
            cpp_compiler: g++-13
          - os: ubuntu-24.04
            c_compiler: clang-19
            cpp_compiler: clang++-19
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt

      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 clang-19

      - name: Install native build tools
        run: python -m pip install -r scripts/requirements-build.txt

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.4.1
        with:
          # aqt 3.3.0 does not support the split Windows repositories in Qt 6.11+.
          version: "6.10.3"
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.3"
          setup-python: false
          cache: true
          cache-key-prefix: qt-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Restore third-party sources
        id: thirdparty-cache
        uses: actions/cache/restore@v5
        with:
          path: CHelper-Core/3rdparty_downloads
          key: thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CHelper-Core/CMakeLists.txt') }}
          restore-keys: |
            thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}/CHelper-Core

      - name: Save third-party sources
        if: steps.thirdparty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: CHelper-Core/3rdparty_downloads
          key: ${{ steps.thirdparty-cache.outputs.cache-primary-key }}

      - name: Build Test
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target CHelperTest

      - name: Run Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "${{ matrix.build_type }}/CHelperTest.exe"
          else
            ./CHelperTest
          fi

      - name: Build Resource Generator
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target CHelperResourceGenerator

      - name: Run Resource Generator
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "${{ matrix.build_type }}/CHelperResourceGenerator.exe"
          else
            ./CHelperResourceGenerator
          fi

      - name: Build CHelperQt
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target CHelperQt
