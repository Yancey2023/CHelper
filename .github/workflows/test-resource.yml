name: test-resource

on:
  push:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/test-resource.yml"
      - "CHelper-Resource/**"
  pull_request:
    branches: ["master", "dev"]
    paths:
      - ".github/workflows/test-resource.yml"
      - "CHelper-Resource/**"

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false

      matrix:
        build_type: [Release]
        c_compiler: [clang-19]
        include:
          - os: ubuntu-24.04
            c_compiler: clang-19
            cpp_compiler: clang++-19

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt

      - name: Cache Linux compiler packages
        uses: actions/cache@v5
        with:
          path: .cache/apt/*.deb
          key: apt-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24-gcc13-clang19-${{ env.ImageVersion }}
          restore-keys: |
            apt-v2-${{ runner.os }}-${{ runner.arch }}-ubuntu24-gcc13-clang19-

      - name: Install Linux compiler
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/apt/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$GITHUB_WORKSPACE/.cache/apt" install -y g++-13 clang-19

      - name: Install native build tools
        run: python -m pip install -r scripts/requirements-build.txt

      - name: Restore third-party sources
        id: thirdparty-cache
        uses: actions/cache/restore@v5
        with:
          path: CHelper-Core/3rdparty_downloads
          key: thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CHelper-Core/CMakeLists.txt') }}
          restore-keys: |
            thirdparty-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}/CHelper-Core

      - name: Save third-party sources
        if: steps.thirdparty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: CHelper-Core/3rdparty_downloads
          key: ${{ steps.thirdparty-cache.outputs.cache-primary-key }}

      - name: Build Resource Generator
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target CHelperResourceGenerator

      - name: Run Resource Generator
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ./CHelperResourceGenerator
