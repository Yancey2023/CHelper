[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0"

# reqwest 0.13 默认 TLS 为 rustls（aws-lc-sys），Windows debug 构建的 PDB 会超过
# link.exe 4GB 上限；限制 dev profile 的调试信息深度（发布构建不受影响）。
[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_json5 = "0.2.1"
indexmap = "2"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "gzip", "form"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
tar = "0.4.46"
flate2 = "1.1.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
regex = "1.13.1"
sha2 = "0.11.0"
sha1 = "0.11.0"
hex = "0.4.3"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
